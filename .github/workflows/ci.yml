name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo run --release --locked --example scale_benchmark
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories licenses bans sources
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run types:generate && npm run typecheck && npm run test && npm run build
        working-directory: web
      - run: node scripts/check-frontend-licenses.mjs
      - run: docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --pull --platform "${{ matrix.platform }}" .
