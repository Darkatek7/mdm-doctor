[package]
name = "mdm-doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mdm_doctor"
path = "src/lib.rs"

[[bin]]
name = "mdm-doctor"
path = "src/main.rs"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["http2", "json", "macros"] }
base64 = "0.22.1"
blake3 = "1.8.2"
bytes = "1.10.1"
cab = "0.6.0"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
csv = "1.4.0"
evtx = "0.12.2"
futures-util = "0.3.31"
http = "1.3.1"
mime_guess = "2.0.5"
printpdf = { version = "0.12.5", default-features = false }
quick-xml = { version = "0.41.0", features = ["serialize"] }
rand = "0.8.5"
regex = "1.11.2"
rusqlite = { version = "0.40.2", features = ["bundled-full", "chrono"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io", "rt"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-br", "compression-gzip", "cors", "fs", "limit", "set-header", "timeout"] }
unicode-normalization = "0.1.24"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
uuid = { version = "1.18.1", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "8.2.0", default-features = false, features = ["bzip2", "deflate", "deflate64", "lzma", "zstd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.176"

[dev-dependencies]
tempfile = "3.23.0"
